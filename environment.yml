name: tethys_tasks
channels:
  - conda-forge
dependencies:
  - python=3.11
  - cdsapi
  - curl
  - paramiko
  - xarray
  # GRIB stack pinned as one family. conda-forge python-eccodes registers with pip as
  # `eccodes==<same version>`, so pinning it inside meteodata-lab's `eccodes>=2.47,<2.48`
  # range stops pip from replacing it with its own wheel + bundled eccodeslib. Two eccodes
  # libraries in one env is what broke every GRIB driver on 2026-08-24.
  - cfgrib=0.9.15.*
  - eccodes=2.47.*
  - python-eccodes=2.47.*
  - gdal
  - scikit-learn
  - pandas
  - pyarrow
  - python-dotenv
  - matplotlib
  - numpy<2
  - scipy
  - netcdf4
  - statsmodels
  - cartopy
  - ipykernel
  - rasterio
  - fastparquet
  - h5netcdf
  - h5py       # ODIM_H5 radar files (irm_radar)
  - pyproj     # projected radar grids -> WGS84 (irm_radar)
  - dropbox
  - paramiko
  - zarr
  - pip
  - pip:
    - boto3
    - BeautifulSoup4
    - ecmwf-opendata
    - seaborn
    - xlwings
    - openpyxl
    - build
    - meteodata-lab[regrid]==0.8.*
    - eccodes-cosmo-resources-python==2.47.0.*
    - earthkit-data==1.2.*
    - earthkit-plots==0.3.*
    - nbconvert>=7.16.6
    - nbformat>=5.10.4
    - meteoraster
    - pytest
    - pytest-cov
    - azure-storage-blob
    - debugpy
